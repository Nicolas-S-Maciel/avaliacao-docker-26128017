version: '3.8'

services:
  portal:
    image: nikottrw/agrovale-portal:1.0-26128017
    container_name: agrovale-portal
    restart: always
    ports:
      - "${PORT_PORTAL:-8017}:80"
    networks:
      - agrovale-net

  manutencao:
    build: ./manutencao
    container_name: agrovale-manutencao
    restart: always
    expose:
      - "80"
    networks:
      - agrovale-net

  proxy:
    build: ./proxy
    container_name: agrovale-proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - portal
      - manutencao
    networks:
      - agrovale-net

  db:
    image: mysql:5.7
    container_name: agrovale-db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - agrovale-net

  blog:
    image: wordpress:latest
    container_name: agrovale-blog
    restart: always
    ports:
      - "${PORT_BLOG:-9017}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - blog_data:/var/www/html
    depends_on:
      - db
    networks:
      - agrovale-net

volumes:
  db_data:
  blog_data:

networks:
  agrovale-net:
    driver: bridge
